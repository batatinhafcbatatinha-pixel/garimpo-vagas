# Atualiza as vagas uma vez por dia e publica o site no GitHub Pages.
# Os dados não são commitados: cada execução baixa os da execução anterior do próprio site.
name: Atualizar e publicar

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC = 09:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Atualizar vagas e montar o site
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          BROWSER_PATH: /usr/bin/google-chrome
        run: node scripts/build-pages.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
